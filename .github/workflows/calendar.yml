name: Sync calendar
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - run: python scripts/fetch_calendar.py
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- events.json || [ -n "$(git ls-files --others --exclude-standard events.json)" ]; then
            git config user.name "calendar-bot"
            git config user.email "calendar-bot@users.noreply.github.com"
            git add events.json
            git commit -m "Update events from Google Calendar"
            git push
          fi
